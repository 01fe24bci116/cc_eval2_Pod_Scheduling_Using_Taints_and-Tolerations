apiVersion: v1
kind: Pod
metadata:
  name: tolerated-test-pod
  namespace: scheduling-lab
  labels:
    experiment: positive-scheduling-test
    eval-problem: "07"
spec:
  # Explicitly select the database worker node
  nodeSelector:
    role: database
  # MATCHING TOLERATION: Allows pod to be scheduled on tainted database worker
  tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "database"
    effect: "NoSchedule"
  containers:
  - name: probe
    image: busybox:latest
    command: ["sh", "-c", "echo 'Tolerated test pod running successfully on dedicated worker'; sleep 3600"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
