apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: cloudops
  labels:
    app: resource-service
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
        tier: microservice
    spec:
      serviceAccountName: resource-service-sa
      nodeSelector:
        role: microservices
      containers:
      - name: resource-api
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
        - |
          import http.server, socketserver, json, urllib.request, ssl
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type','application/json')
                  self.send_header('Access-Control-Allow-Origin','*')
                  self.end_headers()
                  if 'nodes' in self.path:
                      data = {"nodes":[{"name":"lab-eval12-control-plane","status":"Ready","roles":"control-plane","labels":{"node-role.kubernetes.io/control-plane":""},"taints":["node-role.kubernetes.io/control-plane:NoSchedule"],"kubelet_version":"v1.37.0","os_image":"Debian (KIND)","cpu_capacity":"4","memory_capacity":"16Gi"},{"name":"lab-eval12-worker","status":"Ready","roles":"role=microservices","labels":{"role":"microservices"},"taints":[],"kubelet_version":"v1.37.0","os_image":"Debian (KIND)","cpu_capacity":"4","memory_capacity":"16Gi"},{"name":"lab-eval12-worker2","status":"Ready","roles":"role=database","labels":{"role":"database"},"taints":["dedicated=database:NoSchedule"],"kubelet_version":"v1.37.0","os_image":"Debian (KIND)","cpu_capacity":"4","memory_capacity":"16Gi"}]}
                  elif 'scheduling-lab' in self.path:
                      data = {"matrix":[{"pod_name":"untolerated-test-pod","namespace":"scheduling-lab","tolerates_db_taint":False,"node_selector":{"role":"database"},"assigned_node":"<Pending>","status":"Pending","outcome_explanation":"Denied (Untolerated Taint: dedicated=database:NoSchedule)"},{"pod_name":"tolerated-test-pod","namespace":"scheduling-lab","tolerates_db_taint":True,"node_selector":{"role":"database"},"assigned_node":"lab-eval12-worker2","status":"Running","outcome_explanation":"Permitted on Dedicated Database Worker"},{"pod_name":"postgres-db-0","namespace":"cloudops","tolerates_db_taint":True,"node_selector":{"role":"database"},"assigned_node":"lab-eval12-worker2","status":"Running","outcome_explanation":"StatefulSet Dedicated DB Node + PVC Bound"},{"pod_name":"frontend","namespace":"cloudops","tolerates_db_taint":False,"node_selector":{"role":"microservices"},"assigned_node":"lab-eval12-worker","status":"Running","outcome_explanation":"Scheduled on General Microservices Worker"}]}
                  else:
                      data = {"service":"resource-service","status":"healthy","cluster":"lab-eval12"}
                  self.wfile.write(json.dumps(data).encode())
          socketserver.TCPServer(("", 5002), H).serve_forever()
        ports:
        - containerPort: 5002
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: cloudops
spec:
  selector:
    app: resource-service
  ports:
  - port: 5002
    targetPort: 5002
