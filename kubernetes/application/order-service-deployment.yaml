apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudops
  labels:
    app: order-service
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: microservice
    spec:
      # General worker node selector
      nodeSelector:
        role: microservices
      # No tolerations defined
      containers:
      - name: order-api
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
        - |
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type','application/json')
                  self.end_headers()
                  data = {"service":"order-service","status":"healthy","database":"connected","requests":[{"id":1,"requester":"DevOps-Lead","service_name":"order-service","cpu_cores":"500m","memory_mb":"512Mi","status":"Approved","created_at":"2026-11-15 20:00:00"},{"id":2,"requester":"QA-Team","service_name":"load-test-runner","cpu_cores":"1000m","memory_mb":"1024Mi","status":"Pending","created_at":"2026-11-15 20:05:00"},{"id":3,"requester":"DBA","service_name":"postgres-db-0","cpu_cores":"250m","memory_mb":"256Mi","status":"Dedicated-Tolerated","created_at":"2026-11-15 20:10:00"}]}
                  self.wfile.write(json.dumps(data).encode())
              def do_POST(self):
                  self.send_response(200)
                  self.send_header('Content-type','application/json')
                  self.end_headers()
                  self.wfile.write(b'{"status":"Approved","id":4}')
          socketserver.TCPServer(("", 5003), H).serve_forever()
        ports:
        - containerPort: 5003
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloudops
spec:
  selector:
    app: order-service
  ports:
  - port: 5003
    targetPort: 5003
