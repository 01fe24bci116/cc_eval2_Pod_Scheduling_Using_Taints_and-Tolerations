apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloudops
  labels:
    app: auth-service
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: microservice
    spec:
      # General worker node selector
      nodeSelector:
        role: microservices
      # No tolerations defined: Cannot be scheduled on tainted database node
      containers:
      - name: auth-api
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
        - |
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type','application/json')
                  self.end_headers()
                  self.wfile.write(b'{"service":"auth-service","status":"healthy","role":"admin"}')
              def do_POST(self):
                  self.send_response(200)
                  self.send_header('Content-type','application/json')
                  self.end_headers()
                  self.wfile.write(b'{"access_token":"demo-token","user":{"username":"admin"}}')
          socketserver.TCPServer(("", 5001), H).serve_forever()
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cloudops
spec:
  selector:
    app: auth-service
  ports:
  - port: 5001
    targetPort: 5001
