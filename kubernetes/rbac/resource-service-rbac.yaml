apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-service-sa
  namespace: cloudops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudops-resource-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "namespaces", "persistentvolumeclaims", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-resource-reader-binding
subjects:
- kind: ServiceAccount
  name: resource-service-sa
  namespace: cloudops
roleRef:
  kind: ClusterRole
  name: cloudops-resource-reader
  apiGroup: rbac.authorization.k8s.io
