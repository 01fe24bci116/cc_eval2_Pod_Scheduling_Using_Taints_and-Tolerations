apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: cloudops
  labels:
    app: postgres-db
    tier: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  selector:
    app: postgres-db
  clusterIP: None # Headless service for StatefulSet
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-clusterip
  namespace: cloudops
  labels:
    app: postgres-db
    tier: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  selector:
    app: postgres-db
  type: ClusterIP
